# batch-3.yml — driver for batch 3 (5 highest-priority life apps)
#
# Apps: anatomy, health, psychology, philosophy, plumbing
# 1,249 total imgs / 1,226 regen candidates per 2026-08-10 relaxed-bar re-audit.
#
# HARD PREREQUISITE: lq-tools PR adding manga/realistic-cartoon directive to:
#   config/subjects/{anatomy,health,psychology,philosophy,plumbing}/lessons-*.json
# Without this directive, batch 3 reproduces the Aug-5 result (avg 1.4, 95% ≤5).
#
# Generated 2026-09-10.

batch:
  name: life-apps-5-highest-priority
  version: 1
  slug: batch-3
  created: 2026-09-10
  status: pending
  prerequisites:
    - batch-2-complete
    - lq-tools-pr-style-directive-merged   # BLOCKER — see doc
    - pilot-20-verdict-applied
  totalApps: 5
  totalImages: 1249
  regenCandidates: 1226
  estimatedCost:
    hybrid: $49.25             # Imagen-4 lesson scenes + 2.5-flash realtime base
    allImagen4: $49.96
    tierCFallback: $83.68      # 3.1-flash realtime everywhere
    tierDFallback: $24.98      # Imagen-4-fast everywhere
    note: "REALTIME MODE — uses GEMINI_API_KEY from env. --batch disabled."

tiers: &tiers
  imagen-4:
    model: imagen-4.0-generate-001
    provider: gemini
    costPerImage: 0.040
    batchApi: false
    mode: realtime
    auth: GEMINI_API_KEY
    targetScore: 7.5
    useFor: "lesson scenes (Tier A estimate ~43% of fleet)"
  gemini-2.5-flash:
    model: gemini-2.5-flash-image
    provider: gemini
    costPerImage: 0.039
    batchApi: false
    mode: realtime
    auth: GEMINI_API_KEY
    targetScore: 6.0
    useFor: "base images, general lessons (Tier B estimate ~57%)"
  gemini-3.1-flash:
    model: gemini-3.1-flash-image
    provider: gemini
    costPerImage: 0.067
    batchApi: false
    mode: realtime
    auth: GEMINI_API_KEY
    targetScore: 6.0
    useFor: "premium fallback only (if Imagen-4 fails 7.5 and 2.5-flash fails 6.0)"
  imagen-4-fast:
    model: imagen-4.0-fast-generate-001
    provider: gemini
    costPerImage: 0.020
    batchApi: false
    mode: realtime
    auth: GEMINI_API_KEY
    targetScore: 6.0
    useFor: "cheap fallback if Imagen-4 over-quota or quality acceptable"

pacing:
  budgetPerCall: 4.00
  maxImagesPerBatch: 200
  auditBatchSize: 500
  retryRate: 0.10    # known ~3% residue per handover doc

acceptanceGate:
  imagen-4: { keepIf: "score >= 7.5", revertIf: "score < 7.5" }
  gemini-2.5-flash: { keepIf: "score >= 6.0", revertIf: "score < 6.0" }
  gemini-3.1-flash: { keepIf: "score >= 6.0", revertIf: "score < 6.0" }
  imagen-4-fast: { keepIf: "score >= 6.0", revertIf: "score < 6.0" }

# Apps ordered worst-first per the Aug-10 relaxed-bar re-audit:
apps:

  - name: lq-anatomy
    path: life-quest/lq-anatomy
    branch: deploy/hetzner-anatomy-quest   # verify
    configDir: lq-tools/packages/image-tools/src/config/subjects/anatomy
    currentAuditFile: public/images/image-audit-results-2026-08-10.json
    auditSummary: { total: 468, needsRegen: 461, pixelGate: 417, llmFailed: 44 }
    imageCounts:
      totalBase: 468
      regenCandidates: 461
      variants: ~140   # size variants per imageType.variantWidths
    excludePaths:        # already done in pilot-20 (10 imgs each tier)
      # populated after pilot 20 completes
    regenUnits:
      - type: regen-file
        tier: gemini-2.5-flash     # default to Tier B; refine per pilot verdict
        regenFile: /tmp/lq-anatomy-batch3.json
        budgetPerCall: 10           # 461 imgs × $0.039 = $18.0 — needs 3 calls
        calls: 3
        costEstimate: $17.98   # 461 × $0.039
    postStep:
      variants:
        tool: lq-tools/packages/asset-scaffolding/src/generate-missing-variants.ts
        args: --lang=en --group=anatomy
        costEstimate: 0

  - name: lq-health
