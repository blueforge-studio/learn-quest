# Apps NOT in this batch (deferred to batch-4):
#   tech, law, construction, media, game-design, game-dev, maker, electronics,
#   cooking, engineering — need Stage-2 relaxed-bar re-audit first.
#   economics, finance — already covered by their own empties pilot (~14 final residue).

postStep:
  audit:
    model: minimax-m3
    provider: minimax
    rateLimit: 80
    budgetPerApp: 2
  commit:
    message: "batch-3: regenerate {totalImgs} ({regenCandidates} regen candidates, {tierSummary})"
    branches:
      - lq-anatomy: deploy/hetzner-anatomy-quest
      - lq-health: deploy/hetzner-health-quest
      - lq-psychology: deploy/hetzner-psychology-quest
      - lq-philosophy: deploy/hetzner-philosophy-quest
      - lq-plumbing: deploy/hetzner-plumbing-quest

sequence:
  - app: lq-anatomy
    reason: "461/468 regen candidates (98.5%); biggest payoff; pilot app so signal is freshest"
  - app: lq-plumbing
    reason: "150/150 regen candidates (100%); smallest app, easiest win"
  - app: lq-health
    reason: "221/224 (98.7%); second-highest regen density"
  - app: lq-philosophy
    reason: "194/207 (93.7%); mid-tier"
  - app: lq-psychology
    reason: "200/200 (100%); cleanest tail-end"
