        costEstimate: $18.56  # 277 × $0.067
      - type: regen-file
        tier: gemini-2.5-flash
        filterPaths:
          - public/images/lessons/algebra/
          - public/images/lessons/arithmetic/
          - public/images/lessons/geometry/
          - public/images/lessons/statistics/
          - public/images/lessons/word-problems/
