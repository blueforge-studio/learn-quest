        costEstimate: $4.17   # 107 × $0.039

# Variant regeneration is automatic via processConfigBatch + image-processor.generateVariants.
# No separate variant regen unit needed.

# Post-step: audit + acceptance gate per tier
postStep:
  audit:
    model: minimax-m3
    provider: minimax
    rateLimit: 80
    budgetPerApp: 2
  commit:
    message: "batch-1: regenerate {totalImgs} base + ch1-5 ({tierSummary})"
    branches:
      - lq-reading: deploy/hetzner-reading-quest (after rebase)
      - lq-writing: deploy/hetzner-writing-quest
      - lq-math: deploy/hetzner-math-quest

# Sequence within the batch (worst-quality first per pacing constraint)
sequence:
  - app: lq-math
    reason: "highest needsRegen (305/403 = 76%), has rpg/ folders (highest-priority tier)"
  - app: lq-writing
    reason: "162/322 = 50% needsRegen; mid-tier"
  - app: lq-reading
    reason: "92/306 = 30% needsRegen; lowest needsRegen but branch fix needed first"
