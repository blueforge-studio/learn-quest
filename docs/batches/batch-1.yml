# batch-1.yml — driver for batch 1 (school reading+writing+math base + ch1-5)
#
# Driver design:
# - Tier definitions (imagen-4, gemini-3.1-batch) are referenced by name from app sections.
# - Each app lists `regenUnits`: a list of {type, tier, paths[]} entries.
# - `regen-units.type` is one of:
#     "chapter"      — config-driven via --chapter=N (paths are chapter-N dirs)
#     "regen-file"   — filtered audit JSON via --regen-file=<path>
# - A future `batch-driver.ts` (lq-tools/scripts/lib/batch-driver.ts) reads this file,
#   dispatches regenerate-flagged-images.ts per unit, and tracks aggregate spend.
# - This YAML is currently documentation; the driver script is not yet written.
#
# Generated 2026-09-10.

batch:
  name: school-base-ch1-5
  version: 2
  slug: batch-1
  created: 2026-09-10
  updated: 2026-09-10   # pilot-20 verdict applied: Imagen-4 unavailable; Tier A = 3.1-flash
  status: pending
  prerequisites:
    - pilot-20-verdict          # see pilot-imagen4-vs-gemini3.1.md — DONE 2026-09-10
    - pilot-100-verdict         # see pilot-imagen4-vs-gemini3.1.md
    - lq-tools-style-directive-pr-merged   # BLOCKER for hitting target scores
  totalApps: 3
  totalImages: 1007
  estimatedCost:
    hybrid: $62.00              # Tier A 3.1-flash lesson scenes + Tier B 2.5-flash realtime base
    allGemini2_5_flash: $39.27  # cheap fallback (post-directive)
    allGemini3_1_flash: $67.47  # premium fallback
    note: "REALTIME MODE — uses GEMINI_API_KEY from env. --batch disabled (triggers Vertex AI auth path)."

# Tier definitions. Cost references @blueforge-studio/image-gen pricing.ts.
# NOTE 2026-09-10: Imagen-4 (imagen-4.0-generate-001) and Imagen-4-fast are NOT exposed via
# the public Gemini API — Vertex AI OAuth is required. Pilot 20 confirmed both return
# `404 NOT_FOUND` when invoked via GEMINI_API_KEY. Tier A demoted to gemini-3.1-flash.
tiers:
  gemini-3.1-flash:
    model: gemini-3.1-flash-image
    provider: gemini
    costPerImage: 0.067
    batchApi: false
    mode: realtime
    auth: GEMINI_API_KEY
    targetScore: 6.0
    pilotResult: "lq-anatomy n=10, avg 4.0 (+3.0 from 1.0 floor, 60% art-style match)"
    useFor: "Tier A — lesson scenes, rpg/avatars/backgrounds/bosses/equipment"
  gemini-2.5-flash:
    model: gemini-2.5-flash-image
    provider: gemini
    costPerImage: 0.039
    batchApi: false
    mode: realtime
    auth: GEMINI_API_KEY
    targetScore: 5.0
    pilotResult: "lq-anatomy n=10, avg 2.7 (+1.7 from 1.0 floor, 60% art-style match)"
    useFor: "Tier B — base images, subject-folder lessons, lessons/general"
  imagen-4:
    model: imagen-4.0-generate-001
    provider: gemini
    costPerImage: 0.040
    batchApi: false
    mode: realtime
    auth: VERTEX_AI_REQUIRED   # not GEMINI_API_KEY
    targetScore: 7.5
    status: UNAVAILABLE         # 404 NOT_FOUND via GEMINI_API_KEY — Vertex AI OAuth needed
    useFor: "(future) premium fallback if Vertex AI auth is wired"
  imagen-4-fast:
    model: imagen-4.0-fast-generate-001
    provider: gemini
    costPerImage: 0.020
    batchApi: false
    mode: realtime
    auth: VERTEX_AI_REQUIRED
    targetScore: 6.0
    status: UNAVAILABLE
    useFor: "(future) cheap fallback if Vertex AI auth is wired"

# Pacing constraint — verbatim from memory feedback_regen_pacing.md
pacing:
  budgetPerCall: 4.00
  maxImagesPerBatch: 200
  auditBatchSize: 500
  retryRate: 0.10

# Acceptance gate per tier (post-pilot-20, pre-directive target; raise after directive lands)
acceptanceGate:
  gemini-3.1-flash: { keepIf: "score >= 4.0", revertIf: "score < 4.0", postDirectiveTarget: 6.0 }
  gemini-2.5-flash: { keepIf: "score >= 3.0", revertIf: "score < 3.0", postDirectiveTarget: 5.0 }
  revertMethod: "git checkout -- <file> after audit"
  textOnlyRevertAboveThreshold: false

# Apps
apps:

  - name: lq-reading
    path: school-quest/lq-reading
    branch: deploy/hetzner-reading-quest
    branchNote: "currently on chore/shared-app-audit-checks — rebase before batch 1"
    configDir: lq-tools/packages/image-tools/src/config/subjects/reading
    currentAuditFile: public/images/image-audit-results-2026-08-27.json
    auditSummary: { total: 306, needsRegen: 92, avgScore: 4.3 }
    imageCounts:
      lessonsGeneral: 102
      subjectFolders: 12   # comprehension(3) + literature(3) + phonics(3) + vocabulary(3)
      chapter1: 10
      chapter2: 36
      chapter3: 42
      chapter4: 46
      chapter5: 48
      chapter6: 10        # NOT in this batch
      chapter1to5: 182
      baseTotal: 296      # general + subject + ch1-5 (NOT ch6)
    regenUnits:
      - type: chapter
        tier: gemini-3.1-flash
        chapters: [1, 2, 3, 4, 5]
        paths:
          - public/images/lessons/lq-reading/chapter-1/
          - public/images/lessons/lq-reading/chapter-2/
          - public/images/lessons/lq-reading/chapter-3/
          - public/images/lessons/lq-reading/chapter-4/
          - public/images/lessons/lq-reading/chapter-5/
        budgetPerCall: 20
        costEstimate: $12.19  # 182 × $0.067
      - type: regen-file
        tier: gemini-2.5-flash
        filterPaths:
          - public/images/lessons/comprehension/
          - public/images/lessons/literature/
          - public/images/lessons/phonics/
          - public/images/lessons/vocabulary/
          - public/images/lessons/general/
        regenFile: /tmp/lq-reading-base-regen.json
        budgetPerCall: 15
        costEstimate: $4.45   # 114 × $0.039

  - name: lq-writing
    path: school-quest/lq-writing
    branch: deploy/hetzner-writing-quest
    branchNote: "matches handover doc — clean state"
    configDir: lq-tools/packages/image-tools/src/config/subjects/writing
    currentAuditFile: public/images/image-audit-results-2026-08-27.json
    auditSummary: { total: 322, needsRegen: 162, avgScore: 3.4 }
    imageCounts:
      lessonsGeneral: 79
      subjectFolders: 12   # creative(3) + essays(3) + grammar(3) + practical(3)
      chapter1: 15
      chapter2: 48
      chapter3: 48
      chapter4: 57
      chapter5: 48
      chapter6: 15        # NOT in this batch
      chapter1to5: 216
      baseTotal: 307
    regenUnits:
      - type: chapter
        tier: gemini-3.1-flash
        chapters: [1, 2, 3, 4, 5]
        paths:
          - public/images/lessons/lq-writing/chapter-1/
          - public/images/lessons/lq-writing/chapter-2/
          - public/images/lessons/lq-writing/chapter-3/
          - public/images/lessons/lq-writing/chapter-4/
          - public/images/lessons/lq-writing/chapter-5/
        budgetPerCall: 20
        costEstimate: $14.47  # 216 × $0.067
      - type: regen-file
        tier: gemini-2.5-flash
        filterPaths:
          - public/images/lessons/creative/
          - public/images/lessons/essays/
          - public/images/lessons/grammar/
          - public/images/lessons/practical/
          - public/images/lessons/general/
