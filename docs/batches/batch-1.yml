        costEstimate: $3.55   # 91 × $0.039

  - name: lq-math
    path: school-quest/lq-math
    branch: deploy/hetzner-math-quest
    branchNote: "7 unpushed commits — push or rebase before batch 1"
    configDir: lq-tools/packages/image-tools/src/config/subjects/math
    currentAuditFile: public/images/image-audit-results-2026-08-10.json
    auditSummary: { total: 403, needsRegen: 305, avgScore: 2.1 }
    imageCounts:
      lessonsGeneral: 92
      subjectFolders: 15    # algebra(3) + arithmetic(3) + geometry(3) + statistics(3) + word-problems(3)
      rpgBase: 20           # avatars(6) + backgrounds(3) + bosses(5) + equipment(6)
      rpgVariants: 60       # --128/--256/--512 — auto-regenerated by processConfigBatch
      chapter1: 16
      chapter2: 63
